# App git hooks — the quality and boundary gates every change must pass.
# CI runs the same commands (.github/workflows/ci.yml); hooks just fail faster, on your machine.
#
# Install:   pnpm --dir web install   (its `prepare` script runs `lefthook install`)
# Run by hand: lefthook run pre-commit --all-files  |  lefthook run pre-push
# Emergency skip (CI still enforces everything): LEFTHOOK=0 git commit ...
#
# What each hook guards
#   pre-commit  staged files only, seconds: formatting (auto-fixed and re-staged), lint + import boundaries,
#               TypeScript 7 typecheck, i18n catalogs complete, .NET formatting, architecture rules, and the
#               task fence on task/* branches (ADR 0008).
#   commit-msg  commitlint: Conventional Commits in English (web/commitlint.config.mjs).
#   pre-push    everything, minutes: warnings-as-errors build, generated artifacts (OpenAPI → Kubb client, route
#               tree) up to date, all .NET tests (integration tests need Docker), web tests, React Doctor.

min_version: 2.2.0
output:
  - summary
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: web
      group:
        piped: true
        jobs:
          # `web/**/x` doesn't match files directly in web/ (e.g. kubb.config.ts), hence the paired globs.
          - name: format
            root: web/
            glob:
              - "web/*.{ts,tsx,mjs,js,json,jsonc,css,html,md}"
              - "web/**/*.{ts,tsx,mjs,js,json,jsonc,css,html,md}"
            exclude:
              - "web/src/app/route-tree.gen.ts"
              - "web/openapi/**"
            run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true

          - name: lint + boundaries
            root: web/
            glob:
              - "web/*.{ts,tsx,mjs}"
              - "web/**/*.{ts,tsx,mjs}"
            exclude:
              - "web/src/lib/api/gen/**"
              - "web/src/app/route-tree.gen.ts"
            run: pnpm exec oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern {staged_files}

          - name: lint-extra
            root: web/
            glob:
              - "web/*.{ts,tsx,mjs}"
              - "web/**/*.{ts,tsx,mjs,css}"
            exclude:
              - "web/src/lib/api/gen/**"
              - "web/src/app/route-tree.gen.ts"
              - "web/src/test/public/**"
            run: node ../scripts/lint-extra.mjs {staged_files}

          - name: typecheck
            root: web/
            glob:
              - "web/*.{ts,tsx,json}"
              - "web/**/*.{ts,tsx,json}"
            run: pnpm exec tsc -b

          - name: i18n catalogs
            root: web/
            glob: "web/src/**/*.{ts,tsx,po}"
            run: pnpm run --silent i18n:extract && git add src/locales && node ../scripts/check-i18n.mjs

    - name: dotnet
      group:
        piped: true
        jobs:
          - name: format
            glob: "**/*.cs"
            run: dotnet format App.slnx --include {staged_files}
            stage_fixed: true

          - name: architecture
            glob:
              - "**/*.cs"
              - "**/*.csproj"
              - "**/*.props"
              - "**/*.targets"
              - "governance/**"
              - "*.slnx"
            run: dotnet test --project tests/App.ArchitectureTests

    # Task fence (ADR 0008): on task/* branches, changes stay inside the spec's `allow` paths. No-op elsewhere.
    - name: task fence
      run: node scripts/agents/task.mjs check --staged --hook

    # Linters shipped as containers (no local install); they only run when these files are staged.
    - name: dockerfile
      glob: "Dockerfile"
      run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

    - name: workflows
      glob: ".github/workflows/*.{yml,yaml}"
      run: MSYS_NO_PATHCONV=1 docker run --rm -v "$(pwd):/repo" -w /repo rhysd/actionlint:1.7.12

commit-msg:
  jobs:
    - name: commitlint
      root: web/
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: verify
      run: node scripts/verify.mjs --mode pre-push
