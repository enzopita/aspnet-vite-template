# Frontend gates: generated client + route tree freshness, TS 7 typecheck, Oxlint (boundaries), Oxfmt, tests,
# i18n completeness and React Doctor. Runs only when web inputs change; on PRs, reports immediately when skipped so
# required checks never stay pending (ADR 0009); one job; pnpm store cached.
name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/web.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(web/|scripts/|\.github/workflows/web\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --ignore-scripts: skips `prepare` (git hooks are for local clones only).
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Component tests run in headless Chromium (Vitest browser mode, ADR 0005); the download is cached per
      # Playwright version.
      - name: Playwright version
        id: playwright
        if: steps.changes.outputs.run == 'true'
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify (web)
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        run: node scripts/verify.mjs --mode ci --area web
