# Backend gates: warnings-as-errors build, formatting, OpenAPI contract freshness, all .NET tests.
# Cost notes: runs only when backend inputs change; on PRs, reports immediately when skipped so required checks never
# stay pending (ADR 0009); one job; NuGet cache; superseded PR runs are cancelled.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "web/openapi/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "governance/**"
      - "global.json"
      - "App.slnx"
      - ".editorconfig"
      - ".github/workflows/backend.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(src/|tests/|web/openapi/|Directory\.Build\.props$|Directory\.Build\.targets$|Directory\.Packages\.props$|governance/|global\.json$|App\.slnx$|\.editorconfig$|\.github/workflows/backend\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - if: steps.changes.outputs.run == 'true'
        run: dotnet restore App.slnx

      # Warnings are errors (Directory.Build.props); also regenerates web/openapi/app.json.
      - if: steps.changes.outputs.run == 'true'
        run: dotnet build App.slnx --no-restore --configuration Release

      - name: OpenAPI contract is committed and up to date
        if: steps.changes.outputs.run == 'true'
        run: git diff --exit-code -- web/openapi

      - name: Formatting
        if: steps.changes.outputs.run == 'true'
        run: dotnet format whitespace App.slnx --verify-no-changes

      # Architecture, unit and integration tests (Testcontainers uses the runner's Docker).
      - if: steps.changes.outputs.run == 'true'
        run: dotnet test --solution App.slnx --no-build --configuration Release
